[package]
name = "yubihsm-auditor"
version = "0.1.0"
edition = "2024"
description = "Collect YubiHSM 2 audit logs over HTTP and ship them to Splunk, Wazuh, or any syslog receiver"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
rustls = { version = "0.23.43", features = ["ring"] }
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ureq = { version = "3.4.0", features = ["platform-verifier"] }
webpki-roots = "1.0.9"
yubihsm = { version = "0.42.1", features = ["http", "passwords"] }
