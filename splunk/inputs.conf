# File monitor for the `file` output of yubihsm-auditor.
# Install on the universal forwarder running alongside the collector.

[monitor:///var/log/yubihsm/audit.jsonl*]
sourcetype = yubihsm:audit
index = hsm_audit
# host is carried inside each event as device_name; leave the forwarder's own
# host on the event so you can tell which collector shipped it.
crcSalt = <SOURCE>
