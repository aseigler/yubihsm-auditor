# Splunk sourcetype definition for yubihsm-auditor output.
# Install on the indexers / heavy forwarders (and the search head for
# search-time settings) under $SPLUNK_HOME/etc/apps/<your_app>/local/props.conf

[yubihsm:audit]
# One JSON object per line.
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 10000

# Use the collector's estimated operation time, not the ingest time.
TIMESTAMP_FIELDS = time
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 32

# Human-friendly names in the UI.
FIELDALIAS-hsm_key = target_key_id AS object_id
EVAL-vendor_product = "Yubico YubiHSM 2"

# If you forward the JSON lines with a universal forwarder that cannot do
# indexed extractions, replace the first two lines above with:
#   KV_MODE = json
#   INDEXED_EXTRACTIONS =
